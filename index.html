        var color = (theme === 'dark') ? '#0A0A0D' : '#FBF9F5';

        document.documentElement.style.colorScheme = scheme;
        var meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', color);
        }
      } catch (e) {}
    })();
  </script>
