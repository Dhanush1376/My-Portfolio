<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- "D" monogram: ink stem + a round bowl in three page colours. The counter is a real cutout,
       so it also bites a C-shaped notch out of the stem. The stem turns cream on dark tab bars. -->
  <style>
    .stem { fill: #0E0F12; }
    @media (prefers-color-scheme: dark) { .stem { fill: #FBF9F4; } }
  </style>
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect width="40" height="40" fill="#fff"/>
      <circle cx="18.5" cy="20" r="7.5" fill="#000"/>
      <line x1="18.5" y1="20" x2="36.82" y2="9.42" stroke="#000" stroke-width="2.6"/>
      <line x1="18.5" y1="20" x2="36.82" y2="30.58" stroke="#000" stroke-width="2.6"/>
    </mask>
  </defs>
  <g transform="translate(0.9 0)">
    <g mask="url(#m)">
      <rect class="stem" x="5.5" y="4" width="9" height="32" rx="4.5"/>
      <path d="M18.5 20V4A16 16 0 0 1 32.356 12Z" fill="#FF5E3A"/>
      <path d="M18.5 20L32.356 12A16 16 0 0 1 32.356 28Z" fill="#FFA820"/>
      <path d="M18.5 20L32.356 28A16 16 0 0 1 18.5 36Z" fill="#94CF4E"/>
    </g>
  </g>
</svg>
